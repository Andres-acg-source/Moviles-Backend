services:
  - type: web
    name: parkwise-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SIM_KEY
        generateValue: true
      - key: OCCUPANCY_SOURCE
        value: none
      - key: HOLD_MINUTES
        value: "15"
